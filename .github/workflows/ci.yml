# This is a basic workflow to help you get started with Actions

name: c++ CI pipeline

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build-and-test:
    name: Build and Test(ubuntu linux)
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout source code
        uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: cmake --build ${{github.workspace}}/build --config Release --parallel 4

      - name: Run Tests (CTest)
        run: |
          cd ${{github.workspace}}/build
          ctest --output-on-failure -C Release

      - name: Cache Redis Tools Package
        id: cache-redis-tools
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-redis-tools

      - name: Install Redis Benchmark Tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --download-only redis-tools
          sudo dpkg -i /var/cache/apt/archives/*.deb || sudo apt-get install -y redis-tools

      # Launch custom compiled server binary in the background
      - name: Start Custom Server
        run: |
          ${{github.workspace}}/build/kvcache & 
          # Wait up to 5 seconds for your server to wake up on port 6379
          for i in {1..5}; do nc -z 127.0.0.1 6379 && break || sleep 1; done

      # Runs your performance regression script
      - name: Run Performance Benchmark Check
        run: ./benchmarks/ci_check.sh
        env:
          CI_BASELINE_RPS: 1